name: movimento_mobilidade
description: "Biblioteca Flutter de avaliação de mobilidade por visão computacional: telas (Como funciona, Passo 1/2, Passo 2/2 e Resultado) e medição de ângulos articulares."
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+1
  camera_android: ^0.10.10
  camera_platform_interface: ^2.10.0
  google_mlkit_pose_detection:
    path: third_party/google_mlkit_pose_detection
  shared_preferences: ^2.5.3
  flutter_tts: 4.0.2
  fl_chart: 0.68.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.testemovimento.mobilidade
        pluginClass: MovimentoMobilidadePlugin
  assets:
    - assets/images/
    - assets/gifs/
